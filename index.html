<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Torino Air Quality Twin · Inverno</title>
<meta name="author" content="Eng. Jad Ghantous">
<meta name="description" content="A 3D digital twin of Turin's winter air: NO₂, PM10 and PM2.5 on a 100 m grid, with the winter inversion lid. Built by Eng. Jad Ghantous from public data.">
<meta property="og:title" content="Torino Air Quality Twin · Inverno">
<meta property="og:description" content="Turin's winter air in 3D: the lid, the Mole and the city, from public data. Built by Eng. Jad Ghantous.">
<meta property="og:image" content="https://jadghant.github.io/torino-air-quality-twin/og.jpg">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/svg+xml" href="brand/torino-aqt-mark.svg">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css">
<link rel="stylesheet" href="style.css?v=31">
</head>
<body>
<div id="map"></div>

<div id="map-legend">
  <button class="close small" data-hide="legend" aria-label="Hide legend">×</button>
  <div class="ml-title" id="legend-title"></div>
  <canvas id="legend" width="300" height="12"></canvas>
  <div class="ticks" id="ticks"></div>
  <div class="ml-note" data-i18n="legend_note"></div>
</div>

<div id="timeline">
  <button class="close small" data-hide="timeline" aria-label="Hide timeline">×</button>
  <button id="play" aria-label="Play">▶</button>
  <div class="tl-main">
    <div class="tl-top"><span id="when"></span><span id="tl-value"></span></div>
    <div class="tl-track">
      <canvas id="spark"></canvas>
      <input id="slider" type="range" min="0" max="119" value="0" aria-label="Time">
    </div>
  </div>
</div>

<aside id="panel">
  <header>
    <div class="head-row">
      <div class="kicker" id="kicker"></div>
      <div class="head-tools">
        <div class="seg tiny" id="langs"><button data-lang="en" class="on">EN</button><button data-lang="it">IT</button></div>
        <button id="collapse" class="icon" aria-label="Collapse panel">–</button>
      </div>
    </div>
    <img class="brand" src="brand/torino-aqt-lockup.svg" alt="Torino Air Quality Twin">
    <h1>Torino Air Quality Twin</h1>
    <p class="subtitle" data-i18n="subtitle"></p>
    <p class="byline">Built by Eng. Jad Ghantous</p>
  </header>

  <div id="panel-body">
    <section id="winter-sec" class="hidden">
      <div class="seg small" id="winters" aria-label="Winter"></div>
    </section>
    <section>
      <div class="seg" id="pollutants"></div>
    </section>

    <section>
      <div class="seg small" id="modes">
        <button data-mode="daily" class="on" data-i18n="mode_daily"></button>
        <button data-mode="episode" data-i18n="mode_hourly"></button>
      </div>
      <div class="seg small hidden" id="episodes"></div>
    </section>

    <section class="cards">
      <div class="card"><div class="lab" data-i18n="city_avg"></div><div class="val" id="k-mean">–</div><div class="sub" data-i18n="pop_weighted"></div></div>
      <div class="card"><div class="lab" id="k-over-lab"></div><div class="val" id="k-over">–</div><div class="sub" id="k-over-sub"></div></div>
    </section>

    <section class="air">
      <div class="air-col">
        <div class="lab" data-i18n="lid_title"></div>
        <svg id="profile" viewBox="0 0 200 170"></svg>
        <div class="sub" id="lid-note"></div>
      </div>
      <div class="air-col narrow">
        <div class="lab" data-i18n="wind_title"></div>
        <svg id="compass" viewBox="0 0 100 100"></svg>
        <div class="sub center" id="wind-text"></div>
        <div class="sub center" data-i18n="wind_note"></div>
      </div>
    </section>

    <section id="scenario-box">
      <div class="row"><span class="lab" data-i18n="scenario"></span><span id="scen-val">0 %</span></div>
      <input id="scenario" type="range" min="0" max="50" step="5" value="0">
      <div class="note" id="scen-note"></div>
    </section>


    <section class="layers">
      <label><input type="checkbox" id="l-buildings" checked> <span data-i18n="l_buildings"></span></label>
      <label><input type="checkbox" id="l-air" checked> <span data-i18n="l_air"></span></label>
      <label><input type="checkbox" id="l-ground"> <span data-i18n="l_ground"></span></label>
      <label><input type="checkbox" id="l-stations" checked> <span data-i18n="l_stations"></span></label>
      <label><input type="checkbox" id="l-sites"> <span data-i18n="l_sites"></span></label>
      <label><input type="checkbox" id="l-unc"> <span data-i18n="l_unc"></span></label>
    </section>

    <footer>
      <button id="about-btn" class="link" data-i18n="about_btn"></button>
      <a class="link sources" href="sources.html" target="_blank" rel="noopener" data-i18n="sources_btn"></a>
    </footer>
  </div>
</aside>

<div id="chart" class="hidden">
  <button class="close" id="chart-close" aria-label="Close">×</button>
  <div id="chart-title"></div>
  <div class="seg small hidden" id="chart-tabs">
    <button data-tab="twin" class="on"></button>
    <button data-tab="fc" data-i18n="tab_fc"></button>
  </div>
  <div id="fc-controls" class="hidden">
    <select id="fc-winter" aria-label="Winter"></select>
    <button id="fc-prev" aria-label="Previous forecast">‹</button>
    <span id="fc-date"></span>
    <button id="fc-next" aria-label="Next forecast">›</button>
  </div>
  <div id="chart-legend"></div>
  <div class="chart-wrap">
    <svg id="chart-svg" viewBox="0 0 560 200"></svg>
    <div id="chart-tip" class="hidden"></div>
  </div>
  <div id="chart-note"></div>
</div>

<div id="about" class="hidden">
  <div class="sheet">
    <button class="close" id="about-close" aria-label="Close">×</button>
    <div id="about-body"></div>
  </div>
</div>

<script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
<script src="i18n.js?v=33"></script>
<script src="air-layer.js?v=28"></script>
<script src="app.js?v=33"></script>
</body>
</html>
